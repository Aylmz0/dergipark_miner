<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dergipark Miner{% endblock %}</title>
    <link rel="stylesheet" href="/assets/vendor/pico.min.css">
    <link rel="stylesheet" href="/assets/panel.css">
    <script src="/assets/vendor/htmx.min.js" defer></script>
    <script src="/assets/vendor/alpine.min.js" defer></script>
</head>
<body>
    {% import "_icons.html" as icons %}
    <nav>
        <ul>
            <li>
                <a class="brand-link" href="/">{{ icons.ic("book", 17) }}Dergipark Miner</a>
            </li>
        </ul>
        <ul>
            <li>
                <form action="/search" method="get" class="nav-search">
                    <span class="nav-search-icon">{{ icons.ic("search", 13) }}</span>
                    <input type="search" name="q" placeholder="Dergi, makale, yazar, DOI ara..." aria-label="Ara" value="{{ request.query_params.get('q', '') }}">
                </form>
            </li>
        </ul>
        <ul>
            <li><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Panel</a></li>
            <li><a href="/journals" {% if request.url.path.startswith('/journals') %}aria-current="page"{% endif %}>Dergiler</a></li>
            <li><a href="/articles" {% if request.url.path.startswith('/articles') %}aria-current="page"{% endif %}>Makaleler</a></li>
            <li><a href="/exports" {% if request.url.path == '/exports' %}aria-current="page"{% endif %}>Export</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
